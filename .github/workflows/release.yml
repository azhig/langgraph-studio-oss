name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            vscode/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/langgraph_studio_oss/__init__.py)
          ext=$(node -p "require('./vscode/package.json').version")
          echo "tag=$tag python=$py extension=$ext"
          test "$tag" = "$py" && test "$tag" = "$ext"

      - name: Build the UI
        run: pnpm install --frozen-lockfile && pnpm check && pnpm build
        working-directory: frontend

      - name: Build the VS Code extension
        run: pnpm install --frozen-lockfile && pnpm check && pnpm build && pnpm package
        working-directory: vscode

      - name: Build the Python package (wheel and sdist)
        run: |
          uv venv --clear && uv pip install -e ".[dev]"
          .venv/bin/pytest
          uv build

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            vscode/*.vsix
            dist/*.whl
            dist/*.tar.gz
