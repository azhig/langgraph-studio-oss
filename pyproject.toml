[project]
name = "langgraph-studio-oss"
version = "0.1.0"
description = "Открытая альтернатива LangSmith Studio: UI монтируется в ваш Agent Server по пути /studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "starlette>=0.37",
]

[project.optional-dependencies]
# Запасной режим запуска: свой процесс с интерфейсом и обратным прокси
proxy = [
    "httpx>=0.28",
    "uvicorn>=0.30",
]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
langgraph-studio-oss = "langgraph_studio_oss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_studio_oss"]
# Сборка фронта лежит в .gitignore, но в колесо попадать обязана
artifacts = ["src/langgraph_studio_oss/static/**"]
