[project]
name = "langgraph-studio-oss"
dynamic = ["version"]
description = "Unofficial, community-built Studio UI for local LangGraph Agent Servers, mounted at /studio. Not affiliated with LangChain, Inc."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "starlette>=0.37",
]

[project.optional-dependencies]
# Fallback launch mode: a separate process with the UI and a reverse proxy
proxy = [
    "httpx>=0.28",
    "uvicorn>=0.30",
]
dev = [
    "langgraph-cli[inmem]>=0.4",
    "httpx>=0.28",
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
langgraph-studio-oss = "langgraph_studio_oss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/langgraph_studio_oss/__init__.py"

[tool.hatch.build]
# The frontend build is git-ignored but must ship in both the sdist and the wheel
artifacts = ["src/langgraph_studio_oss/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_studio_oss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003: ambiguous-unicode checks (en dashes, arrows in docstrings) are not errors here
ignore = ["RUF001", "RUF002", "RUF003"]
